# Noční záloha databáze (Supabase free plán nemá vlastní zálohy).
#
# Potřebuje dva secrets v repu (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL    Session pooler connection string z Supabase (Connect → Session pooler, port 5432).
#                      Přímé připojení (db.<ref>.supabase.co) je jen IPv6 a z GitHub runneru nejde.
#   BACKUP_PASSPHRASE  Dlouhé náhodné heslo (32+ znaků). Dump se jím šifruje ještě před nahráním,
#                      protože repo je veřejné a artefakty by jinak obsahovaly data uživatelů.
#
# Obnova:
#   gpg --output fakturo.dump --decrypt fakturo-YYYY-MM-DD.dump.gpg
#   pg_restore --no-owner --dbname "<connection string>" fakturo.dump
#
# Zálohuje se schéma public (faktury, klienti, výdaje, nastavení). Soubory ze Supabase Storage
# (loga, fotky účtenek) v dumpu nejsou.

name: Záloha databáze

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Nainstalovat pg_dump 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Vytvořit šifrovaný dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "Chybí secret SUPABASE_DB_URL nebo BACKUP_PASSPHRASE" >&2
            exit 1
          fi
          umask 077
          printf %s "$BACKUP_PASSPHRASE" > "$RUNNER_TEMP/passphrase"
          stamp=$(date -u +%Y-%m-%d)
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema=public --no-owner --no-privileges --format=custom \
            | gpg --batch --yes --pinentry-mode loopback \
                  --passphrase-file "$RUNNER_TEMP/passphrase" \
                  --symmetric --cipher-algo AES256 \
                  --output "fakturo-$stamp.dump.gpg"
          rm -f "$RUNNER_TEMP/passphrase"
          ls -l fakturo-*.dump.gpg

      - name: Nahrát zašifrovanou zálohu
        uses: actions/upload-artifact@v4
        with:
          name: fakturo-db-backup
          path: fakturo-*.dump.gpg
          retention-days: 30
          if-no-files-found: error
